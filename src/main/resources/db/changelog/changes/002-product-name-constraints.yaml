databaseChangeLog:
  - changeSet:
      id: 002-unique-product-name-in-category
      author: andriana
      changes:
        - addUniqueConstraint:
            tableName: products
            columnNames: name, category_id
            constraintName: uk_products_name_category

  - changeSet:
      id: 002-index-product-name
      author: andriana
      changes:
        - createIndex:
            indexName: idx_products_name
            tableName: products
            columns:
              - column:
                  name: name